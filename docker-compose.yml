version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: pdf_app_pg_db
    restart: always
    environment:
      POSTGRES_USER: postgres_master
      POSTGRES_PASSWORD: secure_postgres_pass_2026
      POSTGRES_DB: pdf_app_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres_master -d pdf_app_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  cache:
    image: redis:7-alpine
    container_name: pdf_app_redis_cache
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  vector_db:
    image: chromadb/chroma:latest
    container_name: pdf_app_chroma_vector
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/heartbeat || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3

  ollama:
    image: ollama/ollama:latest
    container_name: pdf_app_ollama_engine
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  translation:
    image: libretranslate/libretranslate:latest
    container_name: pdf_app_libretranslate
    restart: always
    ports:
      - "5000:5000"
    environment:
      LT_HOST: 0.0.0.0
      LT_PORT: 5000
      LT_LOAD_ONLY: "en,es,fr,de,zh"
      LT_UPDATE_MODELS: "false"
    volumes:
      - lt_data:/home/libretranslate/.local
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pdf_app_react_native_web
    restart: always
    ports:
      - "19006:19006"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pdf_app_fastapi_server
    restart: always
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://postgres_master:secure_postgres_pass_2026@db:5432/pdf_app_dev
      - REDIS_URL=redis://cache:6379/0
      - CELERY_BROKER_URL=redis://cache:6379/1
      - CHROMADB_HOST=vector_db
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=mistral:7b-instruct-v0.2
      - LIBRETRANSLATE_URL=http://libretranslate:5000
    volumes:
      - uploads_storage:/app/storage/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      vector_db:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4
    container_name: pdf_app_celery_worker
    restart: always
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://postgres_master:secure_postgres_pass_2026@db:5432/pdf_app_dev
      - REDIS_URL=redis://cache:6379/0
      - CELERY_BROKER_URL=redis://cache:6379/1
      - CHROMADB_HOST=vector_db
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=mistral:7b-instruct-v0.2
      - LIBRETRANSLATE_URL=http://libretranslate:5000
    volumes:
      - uploads_storage:/app/storage/uploads
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      vector_db:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  chroma_data:
  ollama_data:
  lt_data:
  uploads_storage:
