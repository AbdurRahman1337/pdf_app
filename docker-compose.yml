services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: study_assistant_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - MODEL_NAME=${MODEL_NAME:-gemini-1.5-flash}
      - CHROMA_DB_PATH=/app/chroma_db
      - CHUNK_SIZE=500
      - CHUNK_OVERLAP=50
      - RATE_LIMIT_PER_MINUTE=20
      - LLM_TIMEOUT_SECONDS=15
      - MAX_CONTEXT_TOKENS=8000
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-pdf-app-48c12}
      - FIREBASE_CREDENTIALS_PATH=${FIREBASE_CREDENTIALS_PATH:-./firebase_service_account.json}
      - FIRESTORE_COLLECTION_BOOKS=${FIRESTORE_COLLECTION_BOOKS:-books}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GOOGLE_DRIVE_FOLDER_NAME=${GOOGLE_DRIVE_FOLDER_NAME:-AI Study Assistant}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_CLIENT_SECRET_PATH=${GOOGLE_CLIENT_SECRET_PATH:-./google_client_secret.json}
    volumes:
      - chroma_storage:/app/chroma_db
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: study_assistant_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  chroma_storage:
    name: study_assistant_chroma_storage
