services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: study_assistant_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - MODEL_NAME=${MODEL_NAME:-gemini-1.5-flash}
      - CHROMA_DB_PATH=/app/chroma_db
      - CHUNK_SIZE=500
      - CHUNK_OVERLAP=50
      - RATE_LIMIT_PER_MINUTE=20
      - LLM_TIMEOUT_SECONDS=15
      - MAX_CONTEXT_TOKENS=8000
    volumes:
      - chroma_storage:/app/chroma_db
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: study_assistant_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  chroma_storage:
    name: study_assistant_chroma_storage
